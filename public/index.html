    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; width: 100%; }
        .card {
            background: rgba(255,255,255,0.07);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
        }
        .btn:active { transform: scale(0.95); }
        .btn-gold {
            background: linear-gradient(135deg, #f1c40f, #e67e22);
            color: #1a1a2e;
            box-shadow: 0 4px 15px rgba(241,196,15,0.3);
        }
        .btn-red {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            box-shadow: 0 4px 15px rgba(231,76,60,0.3);
        }
        .btn-green {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            box-shadow: 0 4px 15px rgba(46,204,113,0.3);
        }
        .btn-blue {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            box-shadow: 0 4px 15px rgba(52,152,219,0.3);
        }
        .input-field {
            width: 100%;
            padding: 12px 18px;
            border-radius: 50px;
            border: none;
            background: rgba(255,255,255,0.1);
            color: #fff;
            margin-bottom: 12px;
            font-size: 15px;
            outline: 2px solid transparent;
            transition: 0.3s;
        }
        .input-field:focus { outline-color: #f1c40f; }
        .input-field::placeholder { color: #aaa; }
        select.input-field { appearance: none; }

        /* --- Landing Page --- */
        #landingPage {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        #landingPage h1 {
            font-size: 52px;
            background: linear-gradient(135deg, #f1c40f, #e67e22);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            text-shadow: 0 10px 30px rgba(241,196,15,0.2);
        }
        #landingPage p { color: #ccc; font-size: 18px; margin-bottom: 30px; max-width: 400px; }
        #landingPage .btn { margin: 8px; min-width: 160px; }

        /* --- Auth Page --- */
        #authPage { display: none; min-height: 100vh; padding: 20px; padding-top: 50px; }
        #authPage .card { max-width: 400px; margin: 0 auto; }
        #authPage h2 { text-align: center; margin-bottom: 20px; color: #f1c40f; }
        .toggle-auth { text-align: center; margin-top: 15px; font-size: 14px; color: #aaa; }
        .toggle-auth span { color: #f1c40f; cursor: pointer; text-decoration: underline; }

        /* --- Main App --- */
        #app { display: none; }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 15px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            margin-bottom: 20px;

        .header .title { font-weight: bold; font-size: 22px; color: #f1c40f; }
        .header .user-info { text-align: right; font-size: 12px; opacity: 0.8; }
        .header .user-info .balance { font-weight: bold; color: #f1c40f; font-size: 16px; }

        /* --- Lobby --- */
        .section-title { font-size: 18px; margin: 15px 0 10px 5px; opacity: 0.8; }
        .table-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .table-card {
            background: rgba(255,255,255,0.07);
            border-radius: 15px;
            padding: 12px 8px;
            text-align: center;

            transition: 0.3s;
            border: 1px solid rgba(255,255,255,0.05);

        .table-card:active { transform: scale(0.95); }
        .table-card .stake { font-size: 18px; font-weight: bold; color: #f1c40f; }
        .table-card .info { font-size: 11px; color: #aaa; }
        .table-card .status {
            display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 10px; font-weight: bold;
            margin-top: 4px;
        }
        .table-card .status.open { background: #2ecc71; color: white; }
        .table-card .status.playing { background: #e74c3c; color: white; }
        .table-card .status.full { background: #7f8c8d; color: white; }

        /* --- Game View --- */
        #gameView { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: #1a1a2e; z-index: 50; overflow-y: auto; }
        #gameView .back {
            position: absolute; top: 12px; left: 12px;
            background: rgba(0,0,0,0.5); padding: 6px 16px; border-radius: 30px; cursor: pointer; z-index: 60;
        }
        .table-area {
            background: radial-gradient(circle, #1b5e20, #0b3d0b);
            border-radius: 50%; width: 280px; height: 280px;
            margin: 70px auto 0;
            position: relative;
            border: 8px solid #5d3a1a;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.8);
        }
        .seat {
            position: absolute; width: 70px; text-align: center; font-size: 9px;
            transform: translate(-50%, -50%);
        }
        .seat .avatar {
            width: 38px; height: 38px; border-radius: 50%; margin: 0 auto;
            display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold;
            border: 2px solid #fff; background: #444;
        }
        .seat .avatar.bot { border-color: #e74c3c; background: #c0392b; }
        .seat .avatar.me { border-color: #3498db; background: #2980b9; }
        .seat .name { margin-top: 2px; font-weight: bold; text-shadow: 0 1px 4px black; }
        .seat .chips { font-size: 9px; color: #f1c40f; }
        .seat .cards { display: flex; justify-content: center; gap: 2px; margin-top: 2px; }
        .seat .card {
            background: #fff; color: #000; width: 20px; height: 28px;
            border-radius: 3px; font-size: 8px; line-height: 28px; text-align: center; font-weight: bold;
        }
        .controls { text-align: center; margin-top: 20px; padding-bottom: 30px; }
        .controls .btn { margin: 5px; }
        #result { text-align: center; font-size: 20px; font-weight: bold; margin-top: 10px; min-height: 40px; }
        .win { color: #2ecc71; }
        .lose { color: #e74c3c; }
        .tie { color: #f1c40f; }

        /* --- Admin Panel --- */
        #adminPanel { display: none; padding: 20px; }
        #adminPanel h2 { color: #f1c40f; margin-bottom: 20px; }
        .admin-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .admin-table th, .admin-table td { padding: 8px; border-bottom: 1px solid #333; text-align: left; }
        .admin-table th { color: #f1c40f; }
        .admin-table input { width: 80px; padding: 4px; border-radius: 4px; border: none; }
        .admin-table .btn { padding: 4px 10px; font-size: 12px; }

        /* --- Profile Modal --- */
        #profileModal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center; }
        #profileModal .card { max-width: 400px; width: 90%; }

        @media (max-width: 480px) {
            .table-grid { grid-template-columns: 1fr 1fr; }
            .header .title { font-size: 16px; }
            .table-area { width: 220px; height: 220px; }
            .seat { width: 60px; }
            .seat .avatar { width: 30px; height: 30px; font-size: 11px; }
            .seat .card { width: 16px; height: 22px; font-size: 7px; line-height: 22px; }
        }
    </style>
</head>

<script>
    const socket = io();
    let currentUser = null;
    let currentTableId = null;
    let gameLocked = false;
    let isAdmin = false;

    // --- Auth ---
    function showAuth(type) {
        document.getElementById('landingPage').style.display = 'none';
        document.getElementById('authPage').style.display = 'block';
        const title = document.getElementById('authTitle');
        const btn = document.getElementById('authBtn');
        const extra = document.getElementById('authExtra');
        const toggle = document.getElementById('toggleAuthText');
        if (type === 'login') {
            title.innerText = 'Masuk';
            btn.innerText = 'Masuk';
            extra.style.display = 'none';
            toggle.innerHTML = 'Belum punya akun? <span onclick="showAuth(\'register\')">Daftar</span>';
        } else {
            title.innerText = 'Daftar Akun';
            btn.innerText = 'Daftar';
            extra.style.display = 'block';
            toggle.innerHTML = 'Sudah punya akun? <span onclick="showAuth(\'login\')">Masuk</span>';
        }
    }

    async function handleAuth() {
        const username = document.getElementById('authUsername').value.trim();
        const password = document.getElementById('authPassword').value.trim();
        if (!username || !password) return alert('Isi username dan password');

        const isRegister = document.getElementById('authBtn').innerText === 'Daftar';
        const url = isRegister ? '/api/register' : '/api/login';
        
        const body = {
            username,
            password
        };

        if (isRegister) {
            const confirmPassword = document.getElementById('authConfirmPassword').value.trim();
            const name = document.getElementById('authName').value.trim();
            const phone_wa = document.getElementById('authPhoneWA').value.trim();
            const email = document.getElementById('authEmail').value.trim();
            const bank_name = document.getElementById('authBank').value;
            const bank_number = document.getElementById('authBankNumber').value.trim();

            if (password !== confirmPassword) {
                return alert('Password dan konfirmasi password tidak sama');
            }
            if (!name || !phone_wa || !email || !bank_name || !bank_number) {
                return alert('Semua field harus diisi');
            }
            body.confirm_password = confirmPassword;
            body.name = name;
            body.phone_wa = phone_wa;
            body.email = email;
            body.bank_name = bank_name;
            body.bank_number = bank_number;
        }

        try {
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await res.json();
            if (!data.success) {
                alert(data.error || 'Gagal');
                return;
            }
            currentUser = data.user;
            isAdmin = currentUser.isAdmin;
            document.getElementById('authPage').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            updateHeader();
            loadTables();
        } catch (e) {
            alert('Error: ' + e.message);
        }
    }

    function logout() {
        currentUser = null;
        isAdmin = false;
        document.getElementById('app').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'none';
        document.getElementById('gameView').style.display = 'none';
        document.getElementById('landingPage').style.display = 'flex';
    }

    function updateHeader() {
        if (currentUser) {
            document.getElementById('userName').innerText = currentUser.name;
            document.getElementById('globalBalance').innerText = currentUser.balance;
        }
    }

    // --- Lobby ---
    function loadTables() {
        socket.emit('requestTables');
    }

    socket.on('tableList', (tables) => {
        const container = document.getElementById('tableList');
        container.innerHTML = '';
        tables.forEach(t => {
            const card = document.createElement('div');
            card.className = 'table-card';
            const isFull = t.playerCount >= t.maxPlayers;
            const statusClass = t.status === 'waiting' && !isFull ? 'open' : (t.status === 'playing' ? 'playing' : 'full');
            const statusText = t.status === 'waiting' ? (isFull ? 'Penuh' : 'Buka') : (t.status === 'playing' ? 'Main' : 'Penuh');
            card.innerHTML = `
                <div class="stake">💰 ${formatNumber(t.stake)}</div>
                <div class="info">👤 ${t.playerCount}/${t.maxPlayers}</div>
                <div class="status ${statusClass}">${statusText}</div>
            `;
            if (!isFull && t.status === 'waiting') {
                card.onclick = () => joinTable(t.id);
            } else {
                card.style.opacity = '0.5';
                card.style.cursor = 'default';
            }
            container.appendChild(card);
        });
    });

    function formatNumber(n) {
        if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
        if (n >= 1000) return (n/1000).toFixed(0) + 'k';
        return n.toString();
    }

    // --- Join Table ---
    function joinTable(tableId) {
        if (!currentUser) return;
        if (currentUser.balance < 1000) {
            alert('Minimal saldo 1000 untuk bermain.');
            return;
        }
        currentTableId = tableId;
        socket.emit('joinTable', { tableId, userId: currentUser.id });
        document.getElementById('app').style.display = 'none';
        document.getElementById('gameView').style.display = 'block';
        document.getElementById('result').innerHTML = '';
        document.getElementById('btnDeal').disabled = false;
        gameLocked = false;
    }

    function backToLobby() {
        if (currentTableId) {
            socket.emit('leaveTable', { tableId: currentTableId, userId: currentUser.id });
            currentTableId = null;
        }
        document.getElementById('gameView').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        updateHeader();
        loadTables();
    }

    function leaveTable() {
        if (currentTableId) {
            socket.emit('leaveTable', { tableId: currentTableId, userId: currentUser.id });
            currentTableId = null;
        }
        backToLobby();
    }

    // --- Game ---
    function renderTable(players, stake) {
        const area = document.getElementById('tableArea');
        area.innerHTML = '';
        const totalSeats = 8;
        players.forEach((p, i) => {
            const angle = (i / totalSeats) * 2 * Math.PI - (Math.PI / 2);
            const radius = 35;
            const x = 50 + radius * Math.cos(angle);
            const y = 50 + radius * Math.sin(angle);
            const seat = document.createElement('div');
            seat.className = 'seat';
            seat.style.left = `calc(${x}% - 35px)`;
            seat.style.top = `calc(${y}% - 35px)`;
            let avatarClass = 'avatar';
            if (p.isBot) avatarClass += ' bot';
            if (p.id === currentUser.id) avatarClass += ' me';
            let cardHtml = p.hand.map(c => `<div class="card">${c.rank === 1 ? 'A' : c.rank > 10 ? ['J','Q','K'][c.rank-11] : c.rank}</div>`).join('');
            seat.innerHTML = `
                <div class="${avatarClass}">${p.name[0]}</div>
                <div class="name">${p.name}</div>
                <div class="chips">💰 ${formatNumber(p.chips)}</div>
                <div class="cards">${cardHtml}</div>
            `;
            area.appendChild(seat);
        });
    }

    function dealCards() {
        if (gameLocked || !currentTableId || !currentUser) return;
        if (currentUser.balance < 1000) {
            alert('Saldo tidak cukup');
            return;
        }
        document.getElementById('btnDeal').disabled = true;
        socket.emit('dealCards', { tableId: currentTableId, userId: currentUser.id });
        gameLocked = true;
    }

    socket.on('updateTable', (data) => {
        renderTable(data.players, data.stake);
        const me = data.players.find(p => p.id === currentUser.id);
        if (me) {
            currentUser.balance = me.chips;
            updateHeader();
        }
        if (data.status === 'waiting') {
            document.getElementById('btnDeal').disabled = false;
            gameLocked = false;
            document.getElementById('result').innerHTML = '';
        }
    });

    socket.on('gameResult', (data) => {
        renderTable(data.players, data.stake);
        const me = data.players.find(p => p.id === currentUser.id);
        if (me) {
            currentUser.balance = me.chips;
            updateHeader();
        }
        const myResult = data.results.find(r => r.id === currentUser.id);
        if (myResult) {
            let html = '';
            if (myResult.status === 'Win') {
                html = `<span class="win">🎉 KAMU MENANG! +${formatNumber(myResult.amount)}</span>`;
            } else if (myResult.status === 'Lose') {
                html = `<span class="lose">😓 KALAH -${formatNumber(1000)}</span>`;
            } else {
                html = `<span class="tie">🤝 SERI (Koin kembali)</span>`;
            }
            document.getElementById('result').innerHTML = html + `<br><small>Bandar nilai: ${data.bandarVal}</small>`;
        }
    });

    socket.on('error', (msg) => {
        alert(msg);
        document.getElementById('btnDeal').disabled = false;
        gameLocked = false;
    });

    // --- Profile ---
    function showProfile() {
        if (!currentUser) return;
        document.getElementById('profileName').value = currentUser.name || '';
        document.getElementById('profilePhoneWA').value = currentUser.phone_wa || '';
        document.getElementById('profileEmail').value = currentUser.email || '';
        document.getElementById('profileBank').value = currentUser.bank_name || '';
        document.getElementById('profileBankNumber').value = currentUser.bank_number || '';
        document.getElementById('profileModal').style.display = 'flex';
    }

    function closeProfile() {
        document.getElementById('profileModal').style.display = 'none';
    }

    async function saveProfile() {
        const name = document.getElementById('profileName').value.trim();
        const phone_wa = document.getElementById('profilePhoneWA').value.trim();
        const email = document.getElementById('profileEmail').value.trim();
        const bank_name = document.getElementById('profileBank').value;
        const bank_number = document.getElementById('profileBankNumber').value.trim();
        if (!name) return alert('Nama tidak boleh kosong');
        try {
            const res = await fetch('/api/profile', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: currentUser.id, name, phone_wa, email, bank_name, bank_number })
            });
            const data = await res.json();
            if (data.success) {
                currentUser = data.user;
                updateHeader();
                closeProfile();
                alert('Profil berhasil diperbarui!');
            } else {
                alert(data.error || 'Gagal');
            }
        } catch (e) {
            alert('Error: ' + e.message);
        }
    }

    // --- Admin ---
    function showAdmin() {
        if (!isAdmin) return alert('Hanya admin yang bisa akses');
        document.getElementById('app').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        loadAdminUsers();
    }

    function closeAdmin() {
        document.getElementById('adminPanel').style.display = 'none';
        document.getElementById('app').style.display = 'block';
    }

    async function loadAdminUsers() {
        try {
            const res = await fetch('/api/admin/users');
            const users = await res.json();
            const tbody = document.getElementById('adminUserList');
            tbody.innerHTML = '';
            users.forEach(u => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${u.username}</td>
                    <td>${u.name}</td>
                    <td>${u.phone_wa || '-'}</td>
                    <td>${u.bank_name || '-'}</td>
                    <td>${u.bank_number || '-'}</td>
                    <td><input type="number" value="${u.balance}" id="bal_${u.id}"></td>
                    <td>
                        <button class="btn btn-green" style="padding:2px 8px; font-size:11px;" onclick="updateBalance('${u.id}')">Update</button>
                        ${!u.isAdmin ? `<button class="btn btn-red" style="padding:2px 8px; font-size:11px;" onclick="deleteUser('${u.id}')">Hapus</button>` : ''}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        } catch (e) {
            alert('Gagal load users: ' + e.message);
        }
    }

    async function updateBalance(userId) {
        const input = document.getElementById(`bal_${userId}`);
        const amount = parseInt(input.value);
        if (isNaN(amount)) return alert('Masukkan angka valid');
        try {
            const res = await fetch('/api/admin/update-balance', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId, amount })
            });
            const data = await res.json();
            if (data.success) {
                alert('Balance berhasil diperbarui');
                loadAdminUsers();
            } else {
                alert(data.error || 'Gagal');
            }
        } catch (e) {
            alert('Error: ' + e.message);
        }
    }

    async function deleteUser(userId) {
        if (!confirm('Yakin ingin menghapus user ini?')) return;
        try {
            const res = await fetch('/api/admin/delete-user', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId })
            });
            const data = await res.json();
            if (data.success) {
                alert('User dihapus');
                loadAdminUsers();
            } else {
                alert(data.error || 'Gagal');
            }
        } catch (e) {
            alert('Error: ' + e.message);
        }
    }

    // --- Socket Connect ---
    socket.on('connect', () => {
        console.log('Socket connected');
        if (currentUser) loadTables();
    });
</script>
</body>
</html>
